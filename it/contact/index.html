<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contatti</title>
<link rel="shortcut icon" href="../../favicon.ico">
<script async data-id="101513988" src="//static.getclicky.com/js"></script>
<style>
  body {
    background-color: #329fff;
  }
  
  #loading-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #dd1111;
    background-image: url('../../img/american-flag.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9998;
  }

  .dots {
    display: flex;
    gap: 15px;
  }

  .dot {
    width: 30px;
    height: 30px;
    background-color: #dd1111;
    border-radius: 50%;
    animation: bounce 0.6s infinite alternate;
  }

  .dot:nth-child(2) {
    animation-delay: 0.2s;
  }

  .dot:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes bounce {
    from {
      transform: translateY(0);
    }
    to {
      transform: translateY(-20px);
    }
  }
</style>

</head>
<body>

<p style="text-align: center;"><img src="../../img/icon.png" width="90" height="auto" style="max-width: 100%; height: auto; top: 300; z-index: 9999;"><img src="../../img/usa-private-guide_the-guide-group.png" width="300" height="auto" style="max-width: 100%; height: auto; top: 300; margin-left: -20px; z-index: 9999;"></p>

<div id="loading-screen">
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<iframe src="https://app.formbricks.com/s/swvdih5dsx52ygj4blnoc4pf" width="100%" height="768" style="border-radius: 32px; border:none;"></iframe>

<script>
  window.addEventListener('load', function () {
    setTimeout(function () {
      document.getElementById('loading-screen').style.display = 'none';
    }, 2000);
  });
</script>

<p style="font-family: sans-serif; text-align: center; font-size: 8pt; color: #fff;">© 2026 TGG All rights reserved.</p>

</body>
</html>
